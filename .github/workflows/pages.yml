name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'

      - name: Install pinned verification dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check JavaScript syntax
        run: npm run check

      - name: Verify curriculum, exercises, and game behavior
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Version browser assets for this release
        env:
          ASSET_VERSION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          for name in ('index.html',):
              path = Path('dist') / name
              path.write_text(re.sub(r'(?<=\?v=)[A-Za-z0-9.-]+', os.environ['ASSET_VERSION'], path.read_text()))
          PY

      - name: Upload the static site
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
